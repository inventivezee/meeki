# https://github.com/tauri-apps/tauri-action/blob/3013cac/examples/publish-to-auto-release-universal-macos-app-with-signing-certificate.yml#L40-L61
# https://docs.github.com/en/actions/use-cases-and-examples/deploying/installing-an-apple-certificate-on-macos-runners-for-xcode-development
# https://developer.apple.com/help/account/reference/certificate-types/

name: "Setup Apple Certificate"
description: "Import and verify Apple Developer Certificate for code signing"
inputs:
  apple-certificate:
    description: "Base64 encoded Apple certificate"
    required: true
  apple-certificate-password:
    description: "Password for the Apple certificate"
    required: true
  keychain-password:
    description: "Password for the temporary keychain"
    required: true
outputs:
  cert-id:
    description: "The certificate ID for signing"
    value: ${{ steps.verify-cert.outputs.cert-id }}
runs:
  using: "composite"
  steps:
    - name: Setup Certificate
      shell: bash
      run: |
        set -euo pipefail
        echo "${{ inputs.apple-certificate }}" | base64 --decode > certificate.p12
        security create-keychain -p "${{ inputs.keychain-password }}" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "${{ inputs.keychain-password }}" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        security import certificate.p12 -k build.keychain -P "${{ inputs.apple-certificate-password }}" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ inputs.keychain-password }}" build.keychain
        security find-identity -v -p codesigning build.keychain
        rm -f certificate.p12

    - id: verify-cert
      shell: bash
      run: |
        set -euo pipefail
        # `grep` exiting 1 under `set -o pipefail` used to kill this step on the
        # assignment itself, which made the ::error:: below unreachable and
        # reported an expired certificate as a bare "Process completed with exit
        # code 1". Keep the `|| true` so the diagnosis survives the failure.
        CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" || true)
        if [[ -z "$CERT_INFO" ]]; then
          echo "::error::No valid Developer ID Application certificate in the keychain. find-identity -v lists only unexpired identities, so the usual cause is an expired certificate or a lapsed Apple Developer Program membership."
          echo "Identities present (including invalid):"
          security find-identity -p codesigning build.keychain || true
          exit 1
        fi
        CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
        echo "cert-id=$CERT_ID" >> $GITHUB_OUTPUT
        echo "Certificate imported."

        # Print days-to-expiry every run. Nothing else in the pipeline measures
        # this, so a cert quietly approaching its end date is invisible until the
        # build that fails on it.
        if NOT_AFTER=$(security find-certificate -c "$CERT_ID" -p build.keychain 2>/dev/null \
          | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2); then
          if EXPIRY_EPOCH=$(date -j -f "%b %d %T %Y %Z" "$NOT_AFTER" +%s 2>/dev/null); then
            DAYS=$(( (EXPIRY_EPOCH - $(date +%s)) / 86400 ))
            echo "::notice::Signing certificate expires in ${DAYS} day(s) (${NOT_AFTER})"
          fi
        fi
