name: web_cd

# Deliberately workflow_dispatch only, and dry_run defaults to true.
#
# meeki.ai is live and it is not yet confirmed who publishes it today: there is
# no wrangler config in the tree (vinext generates dist/server/wrangler.json at
# build time), no Cloudflare account id anywhere, and .openai/hosting.json's
# project_id matches the git remote of the ChatGPT sites control plane that the
# site was developed on. If that control plane still deploys on push, this
# workflow becomes a second publisher racing it.
#
# Run it once with dry_run: true and compare the reported worker name and
# routes against the Cloudflare dashboard before ever running it for real.
# See DEPLOYMENT.md for the full pre-flight checklist.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without publishing. Leave enabled until the Cloudflare target is confirmed."
        type: boolean
        default: true

concurrency:
  group: web-cloudflare-deploy
  cancel-in-progress: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: git fetch --tags --force
      - uses: ./.github/actions/doxxer_install
      - id: version
        run: |
          VERSION=$(doxxer --config doxxer.web.toml next patch)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"

  deploy:
    needs: compute-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm_install

      - name: Check Cloudflare deployment credentials
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID repository secret}"

      - run: pnpm -F web typecheck
      - run: pnpm -F web build

      # vinext writes the wrangler config as a build artifact rather than the
      # repo holding one, so it only exists after the build above.
      - name: Show resolved deploy target
        working-directory: apps/web
        run: |
          echo "Worker name : $(jq -r .name dist/server/wrangler.json)"
          echo "Compat date : $(jq -r .compatibility_date dist/server/wrangler.json)"
          echo "Assets dir  : $(jq -r .assets.directory dist/server/wrangler.json)"

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "::notice::Dry run — nothing is published."
            pnpm exec wrangler deploy --config dist/server/wrangler.json --dry-run
          else
            pnpm exec wrangler deploy --config dist/server/wrangler.json \
              --message "web v${{ needs.compute-version.outputs.version }} ($GITHUB_SHA)"
          fi

      - name: Verify the SEO endpoints are live
        if: ${{ !inputs.dry_run }}
        run: |
          fail=0
          for path in / /personal /sitemap.xml /llms.txt /robots.txt /favicon.ico; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "https://meeki.ai$path")
            echo "$code  $path"
            [[ "$code" == "200" ]] || fail=1
          done
          # robots.txt is served by Cloudflare's managed content-signals file on
          # some zones, which would shadow app/robots.ts and drop the Sitemap
          # directive. A 200 alone does not prove ours is the one being served.
          if ! curl -s --max-time 30 https://meeki.ai/robots.txt | grep -q "Sitemap:"; then
            echo "::error::robots.txt has no Sitemap directive — Cloudflare's managed robots.txt is probably shadowing app/robots.ts"
            fail=1
          fi
          exit $fail

  tag:
    needs: [compute-version, deploy]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: web_v${{ needs.compute-version.outputs.version }}
          tag_prefix: ""
