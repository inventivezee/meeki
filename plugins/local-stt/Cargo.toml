[package]
name = "tauri-plugin-local-stt"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-local-stt"
description = ""

[features]
default = []
whisper-cpp = ["dep:meeki-transcribe-whisper-local", "dep:meeki-whisper-local"]
coreml = ["whisper-cpp", "meeki-transcribe-whisper-local/coreml"]
directml = ["whisper-cpp", "meeki-transcribe-whisper-local/directml"]
cuda = ["whisper-cpp", "meeki-transcribe-whisper-local/cuda"]
hipblas = ["whisper-cpp", "meeki-transcribe-whisper-local/hipblas"]
openblas = ["whisper-cpp", "meeki-transcribe-whisper-local/openblas"]
metal = ["whisper-cpp", "meeki-transcribe-whisper-local/metal"]
vulkan = ["whisper-cpp", "meeki-transcribe-whisper-local/vulkan"]
openmp = ["whisper-cpp", "meeki-transcribe-whisper-local/openmp"]
[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
meeki-audio-utils = { workspace = true }
meeki-data = { workspace = true }
meeki-language = { workspace = true, features = ["whisper"] }

dirs = { workspace = true }
reqwest = { workspace = true }
rodio = { workspace = true }
similar = { workspace = true }
specta-typescript = { workspace = true }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }

[dependencies]
meeki-am = { workspace = true }
meeki-audio-utils = { workspace = true }
meeki-download-interface = { workspace = true }
meeki-file = { workspace = true }
meeki-host = { workspace = true }
meeki-language = { workspace = true, features = ["whisper"] }
meeki-local-model = { workspace = true }
meeki-local-stt-core = { workspace = true, features = ["specta"] }
meeki-model-downloader = { workspace = true, features = ["specta"] }
meeki-transcribe-soniqo = { workspace = true }
meeki-transcribe-whisper-local = { workspace = true, optional = true }
meeki-whisper-local = { workspace = true, optional = true }
meeki-whisper-local-model = { workspace = true }

owhisper-client = { workspace = true }
owhisper-interface = { workspace = true }

tauri = { workspace = true, features = ["test"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

tauri-plugin-settings = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-sidecar2 = { workspace = true }
tauri-plugin-windows = { workspace = true }

dirs = { workspace = true }
json-patch = "4"
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

axum = { workspace = true, features = ["ws"] }
axum-extra = { workspace = true, features = ["query"] }
tower-http = { workspace = true, features = ["cors", "trace"] }

backon = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

meeki-supervisor = { workspace = true }
ractor = { workspace = true, features = ["async-trait"] }

port-killer = "0.1.0"
port_check = "0.3.0"
