[package]
name = "tauri-plugin-db"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-db"
description = ""

[dependencies]
meeki-agent-access = { workspace = true }
meeki-db-app = { workspace = true }
meeki-db-core = { workspace = true }
meeki-db-execute = { workspace = true }
meeki-db-migrate = { workspace = true }
meeki-db-reactive = { workspace = true, features = ["specta"] }
meeki-e2ee = { workspace = true }
meeki-fs-sync-core = { workspace = true }
meeki-storage = { workspace = true }
meeki-tauri-utils = { workspace = true }

futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "query", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true, features = ["serde_json"] }
specta-typescript = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "macros"] }
tauri = { workspace = true, features = ["test"] }
tauri-plugin-store2 = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
anyhow = { workspace = true }
meeki-db-core = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
wiremock = { workspace = true }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
