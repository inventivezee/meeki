[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
meeki-analytics = { workspace = true }
meeki-api-auth = { workspace = true }
meeki-api-calendar = { workspace = true }
meeki-api-env = { workspace = true }
meeki-api-mail = { workspace = true }
meeki-api-nango = { workspace = true }
meeki-api-pyannote = { workspace = true }
meeki-api-research = { workspace = true }
meeki-api-subscription = { workspace = true }
meeki-api-support = { workspace = true }
meeki-api-sync = { workspace = true }
meeki-api-ticket = { workspace = true }
meeki-linear = { workspace = true }
meeki-llm-proxy = { workspace = true }
meeki-observability = { workspace = true }
meeki-transcribe-proxy = { workspace = true }
owhisper-client = { workspace = true }

axum = { workspace = true, features = ["ws"] }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors", "request-id"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true }

dotenvy = { workspace = true }
envy = { workspace = true }
governor = { workspace = true }
jsonwebtoken = { workspace = true }
sentry = { workspace = true, features = ["tower", "tower-axum-matched-path", "tracing"] }
tower = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
